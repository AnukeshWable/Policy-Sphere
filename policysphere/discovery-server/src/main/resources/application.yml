server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # This is the registry itself: it must not register with / fetch from another Eureka
    register-with-eureka: false
    fetch-registry: false
  server:
    # DEV ONLY: faster removal of dead instances. Keep self-preservation ON in production.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
