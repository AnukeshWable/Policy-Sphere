server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:policy_app}
    password: ${DB_PASSWORD:AppPass123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5       # DEV: see registry changes quickly
  instance:
    lease-renewal-interval-in-seconds: 5     # DEV
    lease-expiration-duration-in-seconds: 15 # DEV
