server:
  port: 8082

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:mysql://localhost:3306/policy_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:policy_app}
    password: ${DB_PASSWORD:AppPass123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:            # applies to every Feign client
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5       # DEV: see registry changes quickly
  instance:
    lease-renewal-interval-in-seconds: 5     # DEV
    lease-expiration-duration-in-seconds: 15 # DEV
